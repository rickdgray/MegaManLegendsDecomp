# Overlay r3_st1a: chunk r3_st1a.bin of CDDATA/DAT/ST1A.BIN, loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st1a.bin
sha1: 0e851436f59c5644d9d03f07426bf9723fcfa412
archive: ST1A.BIN

options:
  basename: r3_st1a
  target_path: build/r3_st1a/original/r3_st1a.bin
  elf_path: build/r3_st1a/r3_st1a.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st1a
  src_path: src/r3_st1a
  build_path: build/r3_st1a

  ld_script_path: build/r3_st1a/r3_st1a.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st1a/symbol_addrs.txt
    - build/r3_st1a/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st1a/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st1a/undefined_syms_auto.txt
  asset_path: assets/r3_st1a

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

