# Overlay r3_st04: chunk R3_ST04.BIN of CDDATA/DAT/ST04.BIN (also ST04B.BIN), loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st04.bin
sha1: bea1dd749bfc834037e228a41ed4c590d42553dc
archive: ST04.BIN
duplicates: [ST04B.BIN]

options:
  basename: r3_st04
  target_path: build/r3_st04/original/r3_st04.bin
  elf_path: build/r3_st04/r3_st04.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st04
  src_path: src/r3_st04
  build_path: build/r3_st04

  ld_script_path: build/r3_st04/r3_st04.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st04/symbol_addrs.txt
    - build/r3_st04/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st04/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st04/undefined_syms_auto.txt
  asset_path: assets/r3_st04

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_st04
    type: code
    start: 0x0
    vram: 0x80100000
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x17
      - [0x4, .rodata, r3_st04_4B6C]
      - [0x34, .rodata, r3_st04_5474]
      - [0xA0, .rodata, r3_st04_61D8]
      - [0x19C, .rodata, r3_st04_8FE0]
      - [0x1B0, .rodata, r3_st04_9FA0]
      - [0x1DC, .rodata, r3_st04_A248]
      - [0x200, c, r3_st04]
      - {start: 0x1E40, type: c, name: stcom36, dir: ../stage_common}  # shared stage code
      - [0x207C, c, r3_st04_207C]
      - {start: 0x215C, type: c, name: stcom01, dir: ../stage_common}  # shared stage code
      - [0x4B6C, c, r3_st04_4B6C]
      - [0x5474, c, r3_st04_5474]
      - [0x61D8, c, r3_st04_61D8]  # low; jump-table alignment restarts between func_80106048 and func_801061D8
      - {start: 0x7CB8, type: c, name: stcom31, dir: ../stage_common}  # shared stage code
      - [0x83E4, c, r3_st04_83E4]
      - {start: 0x89B8, type: c, name: stcom07, dir: ../stage_common}  # shared stage code
      - [0x8FE0, c, r3_st04_8FE0]
      - [0x9FA0, c, r3_st04_9FA0]  # medium; routine dispatcher where r3_st05 and r3_st08 start a file too; the shared code before it ends here in r3_st0d, r3_st10, r3_st19
      - [0xA248, c, r3_st04_A248]  # low; starts at a routine dispatcher; jump-table alignment restarts between func_8010A248 and func_8010A32C
      - [0xA524, data, data]
  - [0x11DD8]
