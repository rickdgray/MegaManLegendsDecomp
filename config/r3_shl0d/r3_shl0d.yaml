# Overlay r3_shl0d: chunk r3_shl0d.bin of CDDATA/DAT/ARM10R.BIN, loaded at 0x800D8800.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_shl0d.bin
sha1: 7ba1a6244e1738cef9c30649a44bc76d32858caa
archive: ARM10R.BIN

options:
  basename: r3_shl0d
  target_path: build/r3_shl0d/original/r3_shl0d.bin
  elf_path: build/r3_shl0d/r3_shl0d.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_shl0d
  src_path: src/r3_shl0d
  build_path: build/r3_shl0d

  ld_script_path: build/r3_shl0d/r3_shl0d.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_shl0d/symbol_addrs.txt
    - build/r3_shl0d/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_shl0d/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_shl0d/undefined_syms_auto.txt
  asset_path: assets/r3_shl0d

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_shl0d
    type: code
    start: 0x0
    vram: 0x800D8800
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x10
      - [0x4, c, r3_shl0d]
      - [0xA58, data, data]
  - [0xABC]
