# Overlay r3_st14: chunk r3_st14.bin of CDDATA/DAT/ST14.BIN, loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st14.bin
sha1: 8d4b1ad0c65bbac60a91ba7d0ae4025acafe9d1b
archive: ST14.BIN

options:
  basename: r3_st14
  target_path: build/r3_st14/original/r3_st14.bin
  elf_path: build/r3_st14/r3_st14.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st14
  src_path: src/r3_st14
  build_path: build/r3_st14

  ld_script_path: build/r3_st14/r3_st14.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st14/symbol_addrs.txt
    - build/r3_st14/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st14/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st14/undefined_syms_auto.txt
  asset_path: assets/r3_st14

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_st14
    type: code
    start: 0x0
    vram: 0x80100000
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x27
      - [0x4, .rodata, r3_st14]     # entry table, jump tables, constants
      - {start: 0x2C, type: .rodata, name: stcom10, dir: ../stage_common}
      - {start: 0xA4, type: .sdata, name: stcom03, dir: ../stage_common}
      - {start: 0xAC, type: .rodata, name: stcom03, dir: ../stage_common}
      - {start: 0xC0, type: .rodata, name: stcom15, dir: ../stage_common}
      - {start: 0xEC, type: .rodata, name: stcom09, dir: ../stage_common}
      - {start: 0x154, type: .rodata, name: stcom16, dir: ../stage_common}
      - [0x168, .rodata, r3_st14_C5D4]
      - [0x1E8, c, r3_st14]
      - {start: 0x1198, type: c, name: stcom10, dir: ../stage_common}  # shared stage code
      - [0x1C28, c, r3_st14_1C28]
      - {start: 0x1EB4, type: c, name: stcom22, dir: ../stage_common}  # shared stage code
      - {start: 0x3DA4, type: c, name: stcom30, dir: ../stage_common}  # shared stage code
      - {start: 0x44F8, type: c, name: stcom19, dir: ../stage_common}  # shared stage code
      - {start: 0x4EDC, type: c, name: stcom03, dir: ../stage_common}  # shared stage code
      - [0x53B4, c, r3_st14_53B4]
