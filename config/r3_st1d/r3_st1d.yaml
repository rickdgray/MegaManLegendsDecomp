# Overlay r3_st1d: chunk r3_st1d.bin of CDDATA/DAT/ST1D.BIN, loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st1d.bin
sha1: 8971feb1030512464fe0d9fddcdeda237e651410
archive: ST1D.BIN

options:
  basename: r3_st1d
  target_path: build/r3_st1d/original/r3_st1d.bin
  elf_path: build/r3_st1d/r3_st1d.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st1d
  src_path: src/r3_st1d
  build_path: build/r3_st1d

  ld_script_path: build/r3_st1d/r3_st1d.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st1d/symbol_addrs.txt
    - build/r3_st1d/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st1d/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st1d/undefined_syms_auto.txt
  asset_path: assets/r3_st1d

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_st1d
    type: code
    start: 0x0
    vram: 0x80100000
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x30
      - [0x4, .rodata, r3_st1d]     # entry table, jump tables, constants
      - {start: 0xDC, type: .rodata, name: stcom15, dir: ../stage_common}
      - {start: 0x108, type: .rodata, name: stcom16, dir: ../stage_common}
      - [0x11C, .rodata, r3_st1d_AD08]
      - {start: 0x130, type: .rodata, name: stcom10, dir: ../stage_common}
      - [0x1A8, .rodata, r3_st1d_11300]
      - {start: 0x1D8, type: .sdata, name: stcom03, dir: ../stage_common}
      - {start: 0x1E0, type: .rodata, name: stcom03, dir: ../stage_common}
      - [0x1F4, .rodata, r3_st1d_12B18]
      - {start: 0x220, type: .rodata, name: stcom09, dir: ../stage_common}
      - [0x288, c, r3_st1d]
      - {start: 0x5580, type: c, name: stcom15, dir: ../stage_common}  # shared stage code
      - [0x7788, c, r3_st1d_7788]
      - {start: 0x8498, type: c, name: stcom16, dir: ../stage_common}  # shared stage code
      - [0xAD08, c, r3_st1d_AD08]
      - {start: 0xF918, type: c, name: stcom18, dir: ../stage_common}  # shared stage code
      - {start: 0xFEBC, type: c, name: stcom11, dir: ../stage_common}  # shared stage code
      - {start: 0x10870, type: c, name: stcom10, dir: ../stage_common}  # shared stage code
      - [0x11300, c, r3_st1d_11300]
      - {start: 0x12258, type: c, name: stcom03, dir: ../stage_common}  # shared stage code
      - {start: 0x12730, type: c, name: stcom02, dir: ../stage_common}  # shared stage code
      - [0x12B18, c, r3_st1d_12B18]
      - {start: 0x12FD0, type: c, name: stcom09, dir: ../stage_common}  # shared stage code
      - [0x13E10, data, data]
  - [0x1A75C]
