# Overlay r3_st12: chunk r3_st12.bin of CDDATA/DAT/ST12.BIN, loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st12.bin
sha1: 922ed469c7a9f8179b9192d604ba22a9d5462c73
archive: ST12.BIN

options:
  basename: r3_st12
  target_path: build/r3_st12/original/r3_st12.bin
  elf_path: build/r3_st12/r3_st12.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st12
  src_path: src/r3_st12
  build_path: build/r3_st12

  ld_script_path: build/r3_st12/r3_st12.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st12/symbol_addrs.txt
    - build/r3_st12/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st12/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st12/undefined_syms_auto.txt
  asset_path: assets/r3_st12

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_st12
    type: code
    start: 0x0
    vram: 0x80100000
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x25
      - [0x4, .rodata, r3_st12]     # entry table, jump tables, constants
      - [0x30, .rodata, r3_st12_18E0]
      - {start: 0x8C, type: .rodata, name: stcom04, dir: ../stage_common}
      - {start: 0xC8, type: .rodata, name: stcom12, dir: ../stage_common}
      - {start: 0x194, type: .rodata, name: stcom05, dir: ../stage_common}
      - [0x1C4, .rodata, r3_st12_7B44]
      - [0x1D4, c, r3_st12]
      - {start: 0x1034, type: c, name: stcom35, dir: ../stage_common}  # shared stage code
      - {start: 0x12B8, type: c, name: stcom07, dir: ../stage_common}  # shared stage code
      - [0x18E0, c, r3_st12_18E0]
      - {start: 0x1B08, type: c, name: stcom01, dir: ../stage_common}  # shared stage code
      - {start: 0x4518, type: c, name: stcom04, dir: ../stage_common}  # shared stage code
      - {start: 0x5218, type: c, name: stcom08, dir: ../stage_common}  # shared stage code
      - {start: 0x5690, type: c, name: stcom12, dir: ../stage_common}  # shared stage code
      - {start: 0x6798, type: c, name: stcom05, dir: ../stage_common}  # shared stage code
      - [0x7B44, c, r3_st12_7B44]
      - [0x7E20, data, data]
  - [0xE57C]
