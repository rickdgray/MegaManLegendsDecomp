# Overlay r3_st10: chunk r3_st10.bin of CDDATA/DAT/ST10.BIN (also ST10B.BIN), loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st10.bin
sha1: 1af931163eed4211c8b4a989fa06214622c7a7f4
archive: ST10.BIN
duplicates: [ST10B.BIN]

options:
  basename: r3_st10
  target_path: build/r3_st10/original/r3_st10.bin
  elf_path: build/r3_st10/r3_st10.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st10
  src_path: src/r3_st10
  build_path: build/r3_st10

  ld_script_path: build/r3_st10/r3_st10.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st10/symbol_addrs.txt
    - build/r3_st10/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st10/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st10/undefined_syms_auto.txt
  asset_path: assets/r3_st10

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_st10
    type: code
    start: 0x0
    vram: 0x80100000
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x23
      - [0x4, .rodata, r3_st10_A28]
      - {start: 0x5C, type: .rodata, name: stcom13, dir: ../stage_common}
      - {start: 0x88, type: .rodata, name: stcom04, dir: ../stage_common}
      - {start: 0xC4, type: .rodata, name: stcom12, dir: ../stage_common}
      - {start: 0x190, type: .rodata, name: stcom21, dir: ../stage_common}
      - {start: 0x2A4, type: .rodata, name: stcom32, dir: ../stage_common}
      - {start: 0x2D0, type: .sdata, name: stcom03, dir: ../stage_common}
      - {start: 0x2D8, type: .rodata, name: stcom03, dir: ../stage_common}
      - [0x2EC, c, r3_st10]
      - {start: 0x93C, type: c, name: stcom38, dir: ../stage_common}  # shared stage code
      - [0xA28, c, r3_st10_A28]
      - {start: 0x1338, type: c, name: stcom13, dir: ../stage_common}  # shared stage code
      - {start: 0x2338, type: c, name: stcom01, dir: ../stage_common}  # shared stage code
      - [0x4D48, c, r3_st10_4D48]
      - {start: 0x53EC, type: c, name: stcom04, dir: ../stage_common}  # shared stage code
      - {start: 0x60EC, type: c, name: stcom17, dir: ../stage_common}  # shared stage code
      - {start: 0x84EC, type: c, name: stcom08, dir: ../stage_common}  # shared stage code
      - {start: 0x8964, type: c, name: stcom12, dir: ../stage_common}  # shared stage code
      - {start: 0x9A6C, type: c, name: stcom23, dir: ../stage_common}  # shared stage code
      - {start: 0xA664, type: c, name: stcom18, dir: ../stage_common}  # shared stage code
      - [0xAC08, c, r3_st10_AC08]
      - {start: 0xB760, type: c, name: stcom07, dir: ../stage_common}  # shared stage code
      - {start: 0xBD88, type: c, name: stcom21, dir: ../stage_common}  # shared stage code
      - {start: 0xDBD0, type: c, name: stcom32, dir: ../stage_common}  # shared stage code
      - {start: 0xE264, type: c, name: stcom14, dir: ../stage_common}  # shared stage code
      - {start: 0xEB28, type: c, name: stcom03, dir: ../stage_common}  # shared stage code
      - [0xF000, data, data]
  - [0x14AC4]
