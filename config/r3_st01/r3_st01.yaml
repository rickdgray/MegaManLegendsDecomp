# Overlay r3_st01: chunk R3_ST01.BIN of CDDATA/DAT/ST01.BIN, loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st01.bin
sha1: d05bdd8e104fb259a9fad844daba9c9af4816df2
archive: ST01.BIN

options:
  basename: r3_st01
  target_path: build/r3_st01/original/r3_st01.bin
  elf_path: build/r3_st01/r3_st01.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st01
  src_path: src/r3_st01
  build_path: build/r3_st01

  ld_script_path: build/r3_st01/r3_st01.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st01/symbol_addrs.txt
    - build/r3_st01/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st01/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st01/undefined_syms_auto.txt
  asset_path: assets/r3_st01

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_st01
    type: code
    start: 0x0
    vram: 0x80100000
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x14
      - [0x4, .rodata, r3_st01]     # entry table, jump tables, constants
      - [0x30, c, r3_st01]
      - [0xB68, data, data]
  - [0x1B5C]
