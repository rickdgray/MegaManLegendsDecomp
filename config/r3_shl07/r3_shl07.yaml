# Overlay prototype: the SHL (special weapon) module r3_shl07.bin, chunk 0 of
# CDDATA/DAT/ARM07R.BIN, loaded at 0x800D8800 (ROCK_NEO's SHL_PROGBIN_LOAD_ADDRESS).
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_shl07.bin
sha1: 60be6f00303c581fddb25fe5ccab7ed23a644273
archive: ARM07R.BIN

options:
  basename: r3_shl07
  target_path: build/r3_shl07/original/r3_shl07.bin
  elf_path: build/r3_shl07/r3_shl07.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_shl07
  src_path: src/r3_shl07
  build_path: build/r3_shl07

  ld_script_path: build/r3_shl07/r3_shl07.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (generated from its registry, minus
  # anything inside this overlay's address range). Calls and data references into ROCK_NEO
  # resolve to those names; the linker gets their addresses from undefined_*_auto.txt.
  symbol_addrs_path:
    - config/r3_shl07/symbol_addrs.txt
    - build/r3_shl07/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_shl07/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_shl07/undefined_syms_auto.txt
  asset_path: assets/r3_shl07

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_shl07
    type: code
    start: 0x0
    vram: 0x800D8800
    align: 1
    subsegments:
      - [0x0, rodata, header]     # one word (0xA); every SHL module starts with one (meaning unknown)
      - [0x4, c, r3_shl07]        # all code; src/r3_shl07/r3_shl07.c
      - [0x428, data, data]       # dispatch table, then tables
  - [0x440]
