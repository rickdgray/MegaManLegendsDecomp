# Overlay r3_st1b: chunk r3_st1b.bin of CDDATA/DAT/ST1B.BIN, loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st1b.bin
sha1: 5914dacde34a1ba79a1fb74b044f8faf2daf1f74
archive: ST1B.BIN

options:
  basename: r3_st1b
  target_path: build/r3_st1b/original/r3_st1b.bin
  elf_path: build/r3_st1b/r3_st1b.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st1b
  src_path: src/r3_st1b
  build_path: build/r3_st1b

  ld_script_path: build/r3_st1b/r3_st1b.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st1b/symbol_addrs.txt
    - build/r3_st1b/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st1b/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st1b/undefined_syms_auto.txt
  asset_path: assets/r3_st1b

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_st1b
    type: code
    start: 0x0
    vram: 0x80100000
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x2E
      - [0x4, .rodata, r3_st1b]     # entry table, jump tables, constants
      - [0x24, .rodata, r3_st1b_E5C]
      - [0x40, .rodata, r3_st1b_22D4]
      - {start: 0x5C, type: .rodata, name: stcom04, dir: ../stage_common}
      - [0x98, .rodata, r3_st1b_603C]
      - [0xAC, .rodata, r3_st1b_6E14]
      - {start: 0xC0, type: .rodata, name: stcom12, dir: ../stage_common}
      - [0x18C, .rodata, r3_st1b_87C4]
      - {start: 0x1A8, type: .rodata, name: stcom05, dir: ../stage_common}
      - [0x1D8, .rodata, r3_st1b_AF9C]
      - {start: 0x1E8, type: .rodata, name: stcom29, dir: ../stage_common}
      - [0x21C, c, r3_st1b]
      - {start: 0xD70, type: c, name: stcom38, dir: ../stage_common}  # shared stage code
      - [0xE5C, c, r3_st1b_E5C]
      - [0x22D4, c, r3_st1b_22D4]  # low; jump-table alignment restarts between func_80101EFC and func_801022D4
      - {start: 0x24E4, type: c, name: stcom01, dir: ../stage_common}  # shared stage code
      - [0x4EF4, c, r3_st1b_4EF4]
      - {start: 0x533C, type: c, name: stcom04, dir: ../stage_common}  # shared stage code
      - [0x603C, c, r3_st1b_603C]
      - [0x6E14, c, r3_st1b_6E14]  # low; an edge of code shared with r3_st03; jump-table alignment restarts between func_80106A34 and func_80106F04
      - {start: 0x7244, type: c, name: stcom08, dir: ../stage_common}  # shared stage code
      - {start: 0x76BC, type: c, name: stcom12, dir: ../stage_common}  # shared stage code
      - [0x87C4, c, r3_st1b_87C4]
      - {start: 0x9BF0, type: c, name: stcom05, dir: ../stage_common}  # shared stage code
      - [0xAF9C, c, r3_st1b_AF9C]
      - {start: 0xB278, type: c, name: stcom07, dir: ../stage_common}  # shared stage code
      - {start: 0xB8A0, type: c, name: stcom29, dir: ../stage_common}  # shared stage code
      - [0xC3EC, c, r3_st1b_C3EC]
      - [0xC560, data, data]
  - [0x13EC4]
