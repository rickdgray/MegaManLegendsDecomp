# Overlay r3_st00: chunk R3_ST00.BIN of CDDATA/DAT/ST00.BIN, loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st00.bin
sha1: b1cde1d7056c6569b2054ed7503e599f2626bef3
archive: ST00.BIN

options:
  basename: r3_st00
  target_path: build/r3_st00/original/r3_st00.bin
  elf_path: build/r3_st00/r3_st00.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st00
  src_path: src/r3_st00
  build_path: build/r3_st00

  ld_script_path: build/r3_st00/r3_st00.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st00/symbol_addrs.txt
    - build/r3_st00/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st00/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st00/undefined_syms_auto.txt
  asset_path: assets/r3_st00

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_st00
    type: code
    start: 0x0
    vram: 0x80100000
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x13
      - [0x4, .rodata, r3_st00]     # entry table, jump tables, constants
      - [0x18, .rodata, r3_st00_10C4]
      - {start: 0x74, type: .rodata, name: stcom15, dir: ../stage_common}
      - [0xA0, .rodata, r3_st00_4474]
      - {start: 0xD4, type: .rodata, name: stcom09, dir: ../stage_common}
      - [0x13C, .rodata, r3_st00_76E8]
      - [0x1B0, .rodata, r3_st00_A68C]
      - [0x258, .rodata, r3_st00_101F8]
      - {start: 0x27C, type: .rodata, name: stcom10, dir: ../stage_common}
      - [0x2F4, .rodata, r3_st00_1216C]
      - {start: 0x308, type: .sdata, name: stcom03, dir: ../stage_common}
      - {start: 0x310, type: .rodata, name: stcom03, dir: ../stage_common}
      - [0x324, c, r3_st00]
      - [0x10C4, c, r3_st00_10C4]  # low; jump-table alignment restarts between func_80100598 and func_801010C4
      - {start: 0x226C, type: c, name: stcom15, dir: ../stage_common}  # shared stage code
      - [0x4474, c, r3_st00_4474]
      - {start: 0x68A8, type: c, name: stcom09, dir: ../stage_common}  # shared stage code
      - [0x76E8, c, r3_st00_76E8]
      - [0xA68C, c, r3_st00_A68C]  # medium; code shared with r3_st13 starts here, where r3_st13 starts a file too (r3_st13_11814)
      - {start: 0xF354, type: c, name: stcom06, dir: ../stage_common}  # shared stage code
      - [0x101F8, c, r3_st00_101F8]
      - {start: 0x116DC, type: c, name: stcom10, dir: ../stage_common}  # shared stage code
      - [0x1216C, c, r3_st00_1216C]
      - {start: 0x17904, type: c, name: stcom35, dir: ../stage_common}  # shared stage code
      - [0x17B88, c, r3_st00_17B88]
      - {start: 0x18AE0, type: c, name: stcom03, dir: ../stage_common}  # shared stage code
      - [0x18FB8, c, r3_st00_18FB8]
      - {start: 0x19800, type: c, name: stcom02, dir: ../stage_common}  # shared stage code
      - [0x19BE8, c, r3_st00_19BE8]
      - [0x19C54, data, data]
  - [0x22700]
