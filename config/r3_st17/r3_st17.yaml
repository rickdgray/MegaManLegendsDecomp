# Overlay r3_st17: chunk r3_st17.bin of CDDATA/DAT/ST17.BIN, loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st17.bin
sha1: ebaa07e52be9d451739a15198c73245a5f46a495
archive: ST17.BIN

options:
  basename: r3_st17
  target_path: build/r3_st17/original/r3_st17.bin
  elf_path: build/r3_st17/r3_st17.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st17
  src_path: src/r3_st17
  build_path: build/r3_st17

  ld_script_path: build/r3_st17/r3_st17.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st17/symbol_addrs.txt
    - build/r3_st17/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st17/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st17/undefined_syms_auto.txt
  asset_path: assets/r3_st17

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_st17
    type: code
    start: 0x0
    vram: 0x80100000
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x2A
      - [0x4, .rodata, r3_st17]     # entry table, jump tables, constants
      - [0x18, .rodata, r3_st17_F10]
      - [0x2C, .rodata, r3_st17_1130]
      - [0x40, .rodata, r3_st17_1A14]
      - [0x8C, .rodata, r3_st17_2D3C]
      - [0xA0, .rodata, r3_st17_39E0]
      - [0x204, .rodata, r3_st17_5638]
      - [0x228, .rodata, r3_st17_6B70]
      - [0x23C, .rodata, r3_st17_702C]
      - [0x268, .rodata, r3_st17_8BD4]
      - [0x29C, .rodata, r3_st17_9334]
      - [0x2B8, .rodata, r3_st17_C36C]
      - [0x2D0, .rodata, r3_st17_C6A0]
      - [0x3B0, .rodata, r3_st17_F600]
      - [0x434, .rodata, r3_st17_1475C]
      - [0x510, .rodata, r3_st17_19474]  # its own unit: the jump table isn't 8-aligned from 0x434
      - [0x52C, c, r3_st17]
      - [0xF10, c, r3_st17_F10]  # low; jump-table alignment restarts between func_80100828 and func_80100F10
      - [0x1130, c, r3_st17_1130]  # low; jump-table alignment restarts at this function's table
      - [0x1A14, c, r3_st17_1A14]  # medium; code shared with r3_st0a, r3_st0b and r3_st0d starts here, where r3_st0a and r3_st0b start a file too
      - [0x2D3C, c, r3_st17_2D3C]  # low; jump-table alignment restarts at this function's table
      - [0x39E0, c, r3_st17_39E0]  # low; jump-table alignment restarts between func_80102FD8 and func_801039E0
      - [0x5638, c, r3_st17_5638]  # low; code shared with other stages ends here; jump-table alignment restarts between func_80104498 and func_80105A0C
      - [0x6B70, c, r3_st17_6B70]  # low; jump-table alignment restarts between func_80105CF8 and func_80106B70
      - [0x702C, c, r3_st17_702C]  # low; jump-table alignment restarts between func_80106E94 and func_8010702C
      - [0x8BD4, c, r3_st17_8BD4]  # low; jump-table alignment restarts between func_8010787C and func_80108BD4
      - [0x9334, c, r3_st17_9334]  # low; jump-table alignment restarts between func_8010919C and func_80109334
      - [0xC36C, c, r3_st17_C36C]  # low; jump-table alignment restarts between func_8010971C and func_8010C36C
      - [0xC6A0, c, r3_st17_C6A0]
      - [0xF600, c, r3_st17_F600]
      - {start: 0x14374, type: c, name: stcom02, dir: ../stage_common}  # shared stage code
      - [0x1475C, c, r3_st17_1475C]
      - [0x19474, c, r3_st17_19474]
      - [0x1A74C, data, data]
  - [0x22BA0]
