      - {start: 0x5E20, type: c, name: stcom15, dir: ../stage_common}  # shared stage code
      - {start: 0x8028, type: c, name: stcom09, dir: ../stage_common}  # shared stage code
      - {start: 0x8E68, type: c, name: stcom16, dir: ../stage_common}  # shared stage code
      - {start: 0xB6D8, type: c, name: stcom27, dir: ../stage_common}  # shared stage code
      - [0xC5D4, c, r3_st14_C5D4]
      - {start: 0xFA90, type: c, name: stcom06, dir: ../stage_common}  # shared stage code
      - {start: 0x10934, type: c, name: stcom11, dir: ../stage_common}  # shared stage code
      - {start: 0x112E8, type: c, name: stcom20, dir: ../stage_common}  # shared stage code
      - [0x11C7C, c, r3_st14_11C7C]
