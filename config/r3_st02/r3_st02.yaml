# Overlay r3_st02: chunk R3_ST02.BIN of CDDATA/DAT/ST02.BIN, loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st02.bin
sha1: 1304a093115249dcd222af08f302f2360272c4e1
archive: ST02.BIN

options:
  basename: r3_st02
  target_path: build/r3_st02/original/r3_st02.bin
  elf_path: build/r3_st02/r3_st02.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st02
  src_path: src/r3_st02
  build_path: build/r3_st02

  ld_script_path: build/r3_st02/r3_st02.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st02/symbol_addrs.txt
    - build/r3_st02/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st02/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st02/undefined_syms_auto.txt
  asset_path: assets/r3_st02

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_st02
    type: code
    start: 0x0
    vram: 0x80100000
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x15
      - [0x4, .rodata, r3_st02]     # entry table, jump tables, constants
      - [0x48, c, r3_st02]
      - {start: 0x5D20, type: c, name: stcom02, dir: ../stage_common}  # shared stage code
      - [0x6108, c, r3_st02_6108]
      - [0x6740, data, data]
  - [0xA678]
