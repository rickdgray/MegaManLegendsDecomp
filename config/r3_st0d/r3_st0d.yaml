# Overlay r3_st0d: chunk r3_st0d.bin of CDDATA/DAT/ST0D.BIN, loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st0d.bin
sha1: 9d2d44730bf670f63b1ac6956fefc23bd5ea51d9
archive: ST0D.BIN

options:
  basename: r3_st0d
  target_path: build/r3_st0d/original/r3_st0d.bin
  elf_path: build/r3_st0d/r3_st0d.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st0d
  src_path: src/r3_st0d
  build_path: build/r3_st0d

  ld_script_path: build/r3_st0d/r3_st0d.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st0d/symbol_addrs.txt
    - build/r3_st0d/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st0d/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st0d/undefined_syms_auto.txt
  asset_path: assets/r3_st0d

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_st0d
    type: code
    start: 0x0
    vram: 0x80100000
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x20
      - [0x4, .rodata, r3_st0d]     # entry table, jump tables, constants
      - [0x100, .rodata, r3_st0d_4C9C]
      - [0x128, .rodata, r3_st0d_7DDC]
      - [0x170, .rodata, r3_st0d_9FD4]
      - [0x184, c, r3_st0d]
      - [0x4C9C, c, r3_st0d_4C9C]
      - {start: 0x53CC, type: c, name: stcom01, dir: ../stage_common}  # shared stage code
      - [0x7DDC, c, r3_st0d_7DDC]
      - {start: 0x9BEC, type: c, name: stcom02, dir: ../stage_common}  # shared stage code
      - [0x9FD4, c, r3_st0d_9FD4]
      - [0xBC50, data, data]
  - [0x124F0]
