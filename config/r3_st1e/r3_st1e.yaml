# Overlay r3_st1e: chunk r3_st1e.bin of CDDATA/DAT/ST1E.BIN, loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st1e.bin
sha1: 837974b80886152717fcd5664f9960da31ebfd15
archive: ST1E.BIN

options:
  basename: r3_st1e
  target_path: build/r3_st1e/original/r3_st1e.bin
  elf_path: build/r3_st1e/r3_st1e.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st1e
  src_path: src/r3_st1e
  build_path: build/r3_st1e

  ld_script_path: build/r3_st1e/r3_st1e.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st1e/symbol_addrs.txt
    - build/r3_st1e/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st1e/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st1e/undefined_syms_auto.txt
  asset_path: assets/r3_st1e

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_st1e
    type: code
    start: 0x0
    vram: 0x80100000
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x31
      - [0x4, .rodata, r3_st1e]     # entry table, jump tables, constants
      - [0x98, .rodata, r3_st1e_2760]
      - [0xAC, c, r3_st1e]
      - [0x2760, c, r3_st1e_2760]
      - {start: 0x3378, type: c, name: stcom02, dir: ../stage_common}  # shared stage code
      - [0x3760, c, r3_st1e_3760]
      - [0x3D98, data, data]
  - [0x9918]
