# Overlay r3_st0b: chunk r3_st0b.bin of CDDATA/DAT/ST0B.BIN, loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st0b.bin
sha1: b89e961562cf4b7e95ffca87e88ecc7ef128fed4
archive: ST0B.BIN

options:
  basename: r3_st0b
  target_path: build/r3_st0b/original/r3_st0b.bin
  elf_path: build/r3_st0b/r3_st0b.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st0b
  src_path: src/r3_st0b
  build_path: build/r3_st0b

  ld_script_path: build/r3_st0b/r3_st0b.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st0b/symbol_addrs.txt
    - build/r3_st0b/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st0b/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st0b/undefined_syms_auto.txt
  asset_path: assets/r3_st0b

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_st0b
    type: code
    start: 0x0
    vram: 0x80100000
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x1E
      - [0x4, .rodata, r3_st0b]     # entry table, jump tables, constants
      - [0x234, .rodata, r3_st0b_9CB0]
      - [0x284, .rodata, r3_st0b_116E0]
      - {start: 0x2AC, type: .sdata, name: stcom03, dir: ../stage_common}
      - {start: 0x2B4, type: .rodata, name: stcom03, dir: ../stage_common}
      - [0x2C8, .rodata, r3_st0b_166EC]
      - [0x37C, c, r3_st0b]
      - {start: 0x72A0, type: c, name: stcom01, dir: ../stage_common}  # shared stage code
      - [0x9CB0, c, r3_st0b_9CB0]
      - {start: 0xE8A0, type: c, name: stcom23, dir: ../stage_common}  # shared stage code
      - [0xF498, c, r3_st0b_F498]
      - {start: 0x1083C, type: c, name: stcom06, dir: ../stage_common}  # shared stage code
      - [0x116E0, c, r3_st0b_116E0]
      - {start: 0x137DC, type: c, name: stcom35, dir: ../stage_common}  # shared stage code
      - {start: 0x13A60, type: c, name: stcom14, dir: ../stage_common}  # shared stage code
      - {start: 0x14324, type: c, name: stcom03, dir: ../stage_common}  # shared stage code
      - [0x147FC, c, r3_st0b_147FC]
      - {start: 0x16304, type: c, name: stcom02, dir: ../stage_common}  # shared stage code
      - [0x166EC, c, r3_st0b_166EC]
      - [0x19050, data, data]
  - [0x20400]
