# Overlay r3_st08: chunk r3_st08.bin of CDDATA/DAT/ST08.BIN, loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st08.bin
sha1: 658a999e11f9af390f0406cf5517ab85ca2fe435
archive: ST08.BIN

options:
  basename: r3_st08
  target_path: build/r3_st08/original/r3_st08.bin
  elf_path: build/r3_st08/r3_st08.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st08
  src_path: src/r3_st08
  build_path: build/r3_st08

  ld_script_path: build/r3_st08/r3_st08.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st08/symbol_addrs.txt
    - build/r3_st08/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st08/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st08/undefined_syms_auto.txt
  asset_path: assets/r3_st08

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_st08
    type: code
    start: 0x0
    vram: 0x80100000
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x1B
      - [0x4, .sdata, r3_st08]      # func_80101424's local initializer (cc1 -G8 puts it in .sdata)
      - [0xC, .rodata, r3_st08]     # jump tables, constants
      - {start: 0x80, type: .rodata, name: stcom04, dir: ../stage_common}
      - [0xBC, .rodata, r3_st08_7470]
      - {start: 0xDC, type: .rodata, name: stcom12, dir: ../stage_common}
      - {start: 0x1A8, type: .rodata, name: stcom05, dir: ../stage_common}
      - [0x1D8, rodata, scale_sizes]  # six-byte copy source plus two opaque trailing bytes
      - {start: 0x1E0, type: .rodata, name: stcom21, dir: ../stage_common}
      - [0x2F4, .rodata, r3_st08_FE78]
      - [0x31C, c, r3_st08]
      - {start: 0x2B94, type: c, name: stcom01, dir: ../stage_common}  # shared stage code
      - [0x55A4, c, r3_st08_55A4]
      - {start: 0x6770, type: c, name: stcom04, dir: ../stage_common}  # shared stage code
      - [0x7470, c, r3_st08_7470]
      - {start: 0x7B80, type: c, name: stcom08, dir: ../stage_common}  # shared stage code
      - [0x7FF8, c, r3_st08_7FF8]
      - {start: 0x8608, type: c, name: stcom12, dir: ../stage_common}  # shared stage code
      - {start: 0x9710, type: c, name: stcom25, dir: ../stage_common}  # shared stage code
      - [0xA6F0, c, r3_st08_A6F0]
      - {start: 0xA910, type: c, name: stcom05, dir: ../stage_common}  # shared stage code
      - [0xBCBC, c, r3_st08_BCBC]
      - {start: 0xCB78, type: c, name: stcom07, dir: ../stage_common}  # shared stage code
      - {start: 0xD1A0, type: c, name: stcom21, dir: ../stage_common}  # shared stage code
      - {start: 0xEFE8, type: c, name: stcom26, dir: ../stage_common}  # shared stage code
