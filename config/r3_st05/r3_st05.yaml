# Overlay r3_st05: chunk R3_ST05.BIN of CDDATA/DAT/ST05.BIN, loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st05.bin
sha1: ac44dc07b5bd4619a178d05a1a91138a4df77b36
archive: ST05.BIN

options:
  basename: r3_st05
  target_path: build/r3_st05/original/r3_st05.bin
  elf_path: build/r3_st05/r3_st05.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st05
  src_path: src/r3_st05
  build_path: build/r3_st05

  ld_script_path: build/r3_st05/r3_st05.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st05/symbol_addrs.txt
    - build/r3_st05/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st05/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st05/undefined_syms_auto.txt
  asset_path: assets/r3_st05

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

