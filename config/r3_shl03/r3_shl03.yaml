# Overlay r3_shl03: chunk r3_shl03.bin of CDDATA/DAT/ARM03R.BIN, loaded at 0x800D8800.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_shl03.bin
sha1: 096fb9b441fd9a017151d0c1a577d7721e579006
archive: ARM03R.BIN

options:
  basename: r3_shl03
  target_path: build/r3_shl03/original/r3_shl03.bin
  elf_path: build/r3_shl03/r3_shl03.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_shl03
  src_path: src/r3_shl03
  build_path: build/r3_shl03

  ld_script_path: build/r3_shl03/r3_shl03.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_shl03/symbol_addrs.txt
    - build/r3_shl03/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_shl03/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_shl03/undefined_syms_auto.txt
  asset_path: assets/r3_shl03

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_shl03
    type: code
    start: 0x0
    vram: 0x800D8800
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x6
      - [0x4, c, r3_shl03]
      - [0x618, data, data]
  - [0x63C]
