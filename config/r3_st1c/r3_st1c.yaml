# Overlay r3_st1c: chunk r3_st1c.bin of CDDATA/DAT/ST1C.BIN, loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st1c.bin
sha1: 50ee82b64e597e347c676eb60085348c05b8b0bd
archive: ST1C.BIN

options:
  basename: r3_st1c
  target_path: build/r3_st1c/original/r3_st1c.bin
  elf_path: build/r3_st1c/r3_st1c.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st1c
  src_path: src/r3_st1c
  build_path: build/r3_st1c

  ld_script_path: build/r3_st1c/r3_st1c.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st1c/symbol_addrs.txt
    - build/r3_st1c/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st1c/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st1c/undefined_syms_auto.txt
  asset_path: assets/r3_st1c

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_st1c
    type: code
    start: 0x0
    vram: 0x80100000
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x2F
      - [0x4, .rodata, r3_st1c_2DF8]
      - [0x1C, c, r3_st1c]
      - {start: 0x3E8, type: c, name: stcom01, dir: ../stage_common}  # shared stage code
      - [0x2DF8, c, r3_st1c_2DF8]
      - [0x3640, data, data]
  - [0x44D8]
