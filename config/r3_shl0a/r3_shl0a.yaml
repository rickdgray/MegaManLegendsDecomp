# Overlay r3_shl0a: chunk r3_shl0a.bin of CDDATA/DAT/ARM13R.BIN, loaded at 0x800D8800.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_shl0a.bin
sha1: 86c6390352bf31d46b524622e039fcd4741fed1e
archive: ARM13R.BIN

options:
  basename: r3_shl0a
  target_path: build/r3_shl0a/original/r3_shl0a.bin
  elf_path: build/r3_shl0a/r3_shl0a.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_shl0a
  src_path: src/r3_shl0a
  build_path: build/r3_shl0a

  ld_script_path: build/r3_shl0a/r3_shl0a.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_shl0a/symbol_addrs.txt
    - build/r3_shl0a/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_shl0a/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_shl0a/undefined_syms_auto.txt
  asset_path: assets/r3_shl0a

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_shl0a
    type: code
    start: 0x0
    vram: 0x800D8800
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0xD
      - [0x4, c, r3_shl0a]
      - [0x704, data, data]
  - [0x758]
