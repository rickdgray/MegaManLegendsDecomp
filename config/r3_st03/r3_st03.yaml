# Overlay r3_st03: chunk R3_ST03.BIN of CDDATA/DAT/ST03.BIN (also ST03B.BIN), loaded at 0x80100000.
# tools/split.sh copies the chunk from disc/overlays/<archive> (tools/extract_overlays.py) to
# target_path and writes ROCK_NEO.EXE's symbols (build/<t>/rock_neo_syms.txt) for splat.
name: r3_st03.bin
sha1: c160e9451415275ca42b3f48cd3b7aa5a197b539
archive: ST03.BIN
duplicates: [ST03B.BIN]

options:
  basename: r3_st03
  target_path: build/r3_st03/original/r3_st03.bin
  elf_path: build/r3_st03/r3_st03.elf
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/r3_st03
  src_path: src/r3_st03
  build_path: build/r3_st03

  ld_script_path: build/r3_st03/r3_st03.ld

  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  ld_bss_is_noload: True

  find_file_boundaries: False

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # The overlay's own symbols first, then ROCK_NEO.EXE's (minus anything inside this overlay).
  symbol_addrs_path:
    - config/r3_st03/symbol_addrs.txt
    - build/r3_st03/rock_neo_syms.txt

  undefined_funcs_auto_path: build/r3_st03/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/r3_st03/undefined_syms_auto.txt
  asset_path: assets/r3_st03

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack

segments:
  - name: r3_st03
    type: code
    start: 0x0
    vram: 0x80100000
    align: 1
    subsegments:
      - [0x0, rodata, header]     # id word 0x16
      - [0x4, .rodata, r3_st03]     # entry table, jump tables, constants
      - [0xF4, .rodata, r3_st03_3CC4]
      - [0x24C, .rodata, r3_st03_A594]
      - [0x264, .rodata, r3_st03_A9A8]
      - {start: 0x2FC, type: .rodata, name: stcom04, dir: ../stage_common}
      - [0x338, .rodata, r3_st03_C66C]
      - {start: 0x38C, type: .rodata, name: stcom12, dir: ../stage_common}
      - {start: 0x458, type: .rodata, name: stcom05, dir: ../stage_common}
      - {start: 0x488, type: .rodata, name: stcom29, dir: ../stage_common}
      - [0x4BC, c, r3_st03]
      - {start: 0x3A88, type: c, name: stcom36, dir: ../stage_common}  # shared stage code
      - [0x3CC4, c, r3_st03_3CC4]
      - {start: 0x7B84, type: c, name: stcom01, dir: ../stage_common}  # shared stage code
      - [0xA594, c, r3_st03_A594]
      - {start: 0xA8D4, type: c, name: stcom37, dir: ../stage_common}  # shared stage code
      - [0xA9A8, c, r3_st03_A9A8]
      - {start: 0xB96C, type: c, name: stcom04, dir: ../stage_common}  # shared stage code
      - [0xC66C, c, r3_st03_C66C]
      - {start: 0xE4D8, type: c, name: stcom08, dir: ../stage_common}  # shared stage code
      - {start: 0xE950, type: c, name: stcom12, dir: ../stage_common}  # shared stage code
      - [0xFA58, c, r3_st03_FA58]
      - {start: 0x104C0, type: c, name: stcom31, dir: ../stage_common}  # shared stage code
      - {start: 0x10BEC, type: c, name: stcom05, dir: ../stage_common}  # shared stage code
      - [0x11F98, c, r3_st03_11F98]
      - {start: 0x12300, type: c, name: stcom20, dir: ../stage_common}  # shared stage code
      - {start: 0x12C94, type: c, name: stcom07, dir: ../stage_common}  # shared stage code
      - [0x132BC, c, r3_st03_132BC]
      - {start: 0x133B4, type: c, name: stcom02, dir: ../stage_common}  # shared stage code
